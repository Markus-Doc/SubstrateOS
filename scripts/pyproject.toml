[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "labctl"
dynamic = ["version"]
description = "SubstrateOS Lab Controller CLI"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "M. Walker" }]
dependencies = ["typer>=0.12"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4"]

[project.scripts]
labctl = "labctl.cli:app"
subos = "labctl.subos:main"

[tool.setuptools]
packages = ["labctl", "labctl.data"]

[tool.setuptools.dynamic]
version = { attr = "labctl.__version__" }

[tool.setuptools.package-data]
"labctl.data" = ["*.md", "*.json"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
